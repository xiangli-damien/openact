[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openact-collect"
version = "0.1.0"
description = "LLM Activation Data Collection - OpenAct"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "OpenAct Contributors"}
]
keywords = ["llm", "interpretability", "activations", "mechanistic-interpretability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openact-core>=0.1.0",
    "accelerate>=0.25.0",
    "torch>=2.2.0,<3",
    "transformers>=4.57.0,<6",
    "datasets>=3.0.0,<6",
    "tomli>=2.0; python_version < '3.11'",
    "tqdm>=4.60.0",
    "numpy>=1.21.0",
    "pandas>=1.4.0",
    "pyarrow>=14.0.0",
    "zarr>=2.14.0,<3",
    "numcodecs>=0.11.0,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
openact = "openact_collect.cli:main"

[project.urls]
Homepage = "https://github.com/openact/openact"
Repository = "https://github.com/openact/openact"

[tool.hatch.build.targets.wheel]
packages = ["src/openact_collect"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download models or require GPU (deselect with '-m \"not slow\"')",
    "gpu: tests that require a CUDA-capable GPU",
    "integration: end-to-end integration tests",
]
filterwarnings = [
    "ignore::UserWarning:openact_core",
]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
