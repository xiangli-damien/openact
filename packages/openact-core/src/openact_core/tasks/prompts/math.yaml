variants:
  zot:
    template: |
      Question: {problem}
      Please reason step by step, and put your final answer within \boxed{{{{}}}}.
    answer_prefix: "\\boxed"
    description: "Zero-shot-of-thought expecting LaTeX boxed answer."

  simple:
    template: "{problem}"
    answer_prefix: "\\boxed"
    description: "Raw problem only."
