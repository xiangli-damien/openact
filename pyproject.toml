[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openact"
version = "0.1.0"
description = "LLM Activation Data Infrastructure - Monorepo"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "OpenAct Contributors"}
]
keywords = ["llm", "interpretability", "activations", "mechanistic-interpretability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openact-core>=0.1.0",
    "openact-collect>=0.1.0",
    "openact-eval>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-json-report>=1.5",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
openact-core = { workspace = true }
openact-collect = { workspace = true }
openact-eval = { workspace = true }

[tool.hatch.build]
packages = ["src/openact"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "network: marks tests as requiring network (e.g. HuggingFace Hub)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
