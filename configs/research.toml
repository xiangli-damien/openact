# Collection runs in OpenAct. Analysis tables are recorded for your CPU fitter;
# this repository does not yet implement GMM/ICL fitting or FAR calibration.
[model]
identifier = "meta-llama/Llama-3.2-1B-Instruct"
backend = "transformers"
dtype = "bfloat16"
device_map = "auto"
attn_implementation = "sdpa"

[model_catalog]
default_state_map = "meta-llama/Llama-3.2-1B-Instruct"
qwen_reliability = "Qwen/Qwen2-7B-Instruct"
llama_reasoning = "meta-llama/Meta-Llama-3-8B-Instruct"
llama_safety = "meta-llama/Llama-2-7b-chat-hf"

[collection]
task = "math"
output = "runs/math_llama32_1b"
template = "zot"
max_samples = 20 # Start with a GPU smoke run; raise for the full experiment.
extraction = "teacher_forced_forward"

[generation]
max_new_tokens = 2048
temperature = 0.0
do_sample = false
top_p = 1.0
seed = 42

[capture]
hidden_states = true
# Omit hidden_states_layers to capture 0..L, including embeddings (paper §3.1).
hidden_states_dtype = "float32" # Preserve bf16 values exactly when saving.
final_norm = true
save_per_token = true
save_mean_states = true
save_prompt_last = true
compute_online_metrics = true
attention = false
mlp = false

[analysis]
execution = "external"
device = "cpu"
representations = ["hidden_states", "final_norm/pre", "final_norm/post"]
normalize_hidden_states = false
seed = 42

[analysis.gmm]
covariance_type = "diag"
k_selection = "icl"
k_min = 1
k_max = 80

[analysis.alignment]
algorithm = "hungarian"
metric = "cosine"
eta = 0.6

[analysis.split]
stratified = true
fit_fraction = 0.4
evaluation_fraction = 0.6

[analysis.smoothing]
method = "laplace"
alpha = 1.0

[analysis.monitoring]
target_far = 0.10

[safety_judge]
identifier = "meta-llama/LlamaGuard-7b"
version_status = "provisional"
dtype = "bfloat16"
device_map = "auto"
